# Install on the production host after configuring DNS and valid TLS certificates.
server {
    listen 80;
    server_name vekec.kpt.ac.th;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://vekec.kpt.ac.th$request_uri; }
}
server {
    listen 443 ssl;
    server_name vekec.kpt.ac.th;
    ssl_certificate /etc/letsencrypt/live/vekec.kpt.ac.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vekec.kpt.ac.th/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 260m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Authorization codes must not be written to proxy access logs.
    location = /auth/thaid/callback {
        access_log off;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host vekec.kpt.ac.th;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host vekec.kpt.ac.th;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 130s;
    }
}
