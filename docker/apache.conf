<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    SetEnvIf Request_URI "^/auth/thaid/callback" sensitive
    CustomLog /proc/self/fd/1 combined env=!sensitive
    ErrorLog /proc/self/fd/2
    ServerSignature Off
</VirtualHost>
